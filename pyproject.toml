[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "triscan"
version = "0.1.0"
description = "Checklist ejecutable de AI TRiSM: revisa proyectos con IA contra 12 controles y genera un informe."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = ["PyYAML>=6"]
keywords = ["ai-trism", "llm", "seguridad", "gobernanza", "owasp", "checklist"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Security",
  "Natural Language :: Spanish",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
triscan = "triscan.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
triscan = ["*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
